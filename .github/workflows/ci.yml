name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows, like the station: drop_folder.rs reads Windows file attributes
    # and scanner.rs names COM ports.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      # Also produces dist/, which the Tauri crate requires before it compiles.
      - name: Build frontend (tsc + vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # npm run lint is left out until its pre-existing baseline (see AGENTS.md) is cleared.
