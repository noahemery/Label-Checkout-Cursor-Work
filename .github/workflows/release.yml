name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version. Bump the version, then tag v$version."
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Label Verification ${{ github.ref_name }}
          releaseBody: NSIS installer for the floor station. Review, then publish.
          releaseDraft: true
          prerelease: false
